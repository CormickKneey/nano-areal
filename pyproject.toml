[project]
name = "nano-areal"
version = "0.1.0"
description = "A minimal implementation of AReaL: async agentic RL for LLMs"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
    "datasets>=3.0",
    "openai>=1.0",
    "rich>=13.0",
    "plotly>=5.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "safetensors>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "huggingface-hub>=0.22",
    "modelscope>=1.14",
]

[project.optional-dependencies]
# 2×GPU async mode (Linux/CUDA)
gpu = [
    "vllm>=0.6",
    "awex>=0.1",
]

# macOS sync mode
metal = [
    "vllm-metal",
]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
dev-dependencies = ["pytest", "ruff"]
